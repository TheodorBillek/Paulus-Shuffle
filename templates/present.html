<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shuffle Service — Present</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .present-header {
      background: var(--teal-dark);
      color: white;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .present-header .class-name { font-size: 18px; }
    .present-header .session-info { font-size: 13px; opacity: 0.8; }
    .present-body {
      flex: 1;
      overflow: auto;
      padding: 24px 32px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .present-body .classroom-grid {
      transform-origin: top center;
    }
    .present-body .teacher-bar {
      font-size: 14px;
      padding: 10px;
    }
    .present-body .grid-row { gap: 18px; margin-bottom: 14px; }
    .present-body .grid-seat { width: 120px; min-height: 68px; }
    .present-body .chip-name { font-size: 15px; font-weight: 600; }
    .present-body .chip-gender { font-size: 10px; }
    .present-footer {
      padding: 8px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-xsub);
      text-align: center;
      flex-shrink: 0;
    }
    #btn-close-present {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 4px 12px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }
    #btn-close-present:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>

<div class="present-header">
  <div>
    <div class="class-name" id="present-class-name"></div>
    <div class="session-info" id="present-session-info"></div>
  </div>
  <button id="btn-close-present" onclick="window.close()">✕ Close</button>
</div>

<div class="present-body">
  <div id="present-grid"></div>
</div>

<div class="present-footer">
  Press <kbd style="background:#e2e8f0;padding:1px 5px;border-radius:2px;font-family:monospace;">Escape</kbd> or close this tab to exit presentation mode
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/grid.js"></script>
<script>
  I18n.init();
  const raw = localStorage.getItem('ps_present');
  if (raw) {
    const data = JSON.parse(raw);
    document.getElementById('present-class-name').textContent = data.class_name || '';
    const d = new Date();
    document.getElementById('present-session-info').textContent = d.toLocaleDateString() + '  ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const studentsById = Object.fromEntries((data.students || []).map(s => [s.id, s]));
    Grid.renderPresent({
      seats: data.seats || [],
      students: studentsById,
      assignment: data.assignment || {},
      soloSet: new Set(data.solo_students || []),
      container: document.getElementById('present-grid'),
    });
  } else {
    document.getElementById('present-grid').innerHTML = '<p style="color:#94a3b8;padding:40px;">No seating data. Generate a plan first, then click Present.</p>';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
</script>
</body>
</html>
